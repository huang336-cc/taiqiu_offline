<!doctype html>
<html lang="zh-CN">
  <head>
    <title>台球大师 · 离线版</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="description" content="真实物理引擎的单机离线台球游戏" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
    />
    <link rel="stylesheet" type="text/css" href="css/fonts.css" />
    <link rel="stylesheet" type="text/css" href="css/index.css" />
    <link rel="stylesheet" type="text/css" href="css/aiminputs.css" />
    <link rel="stylesheet" type="text/css" href="css/powerinput.css" />
    <link rel="stylesheet" type="text/css" href="css/notification.css" />
    <link rel="stylesheet" type="text/css" href="css/tray.css" />
    <link rel="stylesheet" type="text/css" href="css/chat.css" />
    <link rel="stylesheet" type="text/css" href="css/menu.css" />
    <link rel="stylesheet" type="text/css" href="css/wood.css" />
    <link rel="stylesheet" type="text/css" href="css/ingame-cn.css" />
  </head>

  <body>
    <h1 hidden>台球大师 单机离线版</h1>
    <div id="viewP1" class="view3d">
      <!-- v1.1.10：资源异步加载期间的 Loading 覆盖层，避免几百毫秒黑屏 -->
      <div class="view3d-loading" id="view3dLoading">
        <div class="view3d-loading-spinner"></div>
        <div class="view3d-loading-text">加载中…</div>
      </div>
      <div id="snookerScoreOverlay">
        <div id="snookerScore" aria-live="polite">
          <div id="breakScore" class="breakScore"></div>
        </div>
      </div>
      <div id="notificationOverlay">
        <div id="notification" aria-live="assertive" role="alert"></div>
      </div>
      <div id="helpOverlay" hidden>
        <iframe title="游戏菜单"></iframe>
        <div class="help-footer">
          <button class="lobby-btn" id="backToMenu">返回主菜单</button>
          <span class="help-text">操作说明 · 设置 · 规则</span>
          <button id="helpClose">关闭</button>
        </div>
      </div>
      <div class="chatarea">
        <div id="chatoutput" class="chatoutput"></div>
      </div>
    </div>
    <div id="panel" class="panel wood-texture">
      <div class="aimControlColumn">
        <div class="aimingArea">
          <button
            class="hitButton timeout-btn"
            id="cueHit"
            type="button"
            aria-label="击球"
          >
            击球
          </button>
        </div>
        <div id="tiltSliderContainer" class="tiltSliderContainer" hidden>
          <angle-input id="cueTilt" aria-label="抬杆角度"></angle-input>
        </div>
        <template id="angle-input-template">
          <div class="area" id="area">
            <div class="ball"></div>
            <div class="rotator" id="rot">
              <div class="stick">
                <div class="tip"></div>
                <div class="ferrule"></div>
                <div class="shaft"></div>
                <div class="butt"></div>
              </div>
            </div>
          </div>
        </template>
        <div id="ballContainerWrapper" class="ballContainerWrapper">
          <button
            id="openElevation"
            class="openElevation"
            aria-label="抬杆角度"
          >
            +
          </button>
          <button
            id="resetSpin"
            class="resetSpin"
            aria-label="加塞复位"
          >
            ⟲
          </button>
          <div id="ballContainer" class="ballContainer">
            <div id="objectBall" class="objectBall"></div>
            <div id="cueBall" class="cueBall">
              <div id="cueTip" class="cueTip"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="powerAimRow">
        <div id="powerSliderContainer" class="powerSliderContainer">
          <div class="power-track"></div>
          <input
            class="powerSlider"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.65"
            id="cuePower"
            aria-label="击球力度"
          />
          <span id="powerPercent" class="powerPercent">65%</span>
        </div>
        <!-- 横向瞄准角度滑动条：贴在力度框旁边，与瞄准方向同步 -->
        <div id="aimAngleBar" class="aim-angle-bar" hidden>
          <button
            type="button"
            class="aim-nudge"
            id="aimNudgeL"
            aria-label="瞄准左微调"
          >
            ‹
          </button>
          <div class="aim-angle-track">
            <span class="aim-angle-center"></span>
            <input
              type="range"
              id="aimAngle"
              class="aim-angle-slider"
              min="-1"
              max="1"
              step="0.0005"
              value="0"
              aria-label="横向瞄准角度"
            />
          </div>
          <button
            type="button"
            class="aim-nudge"
            id="aimNudgeR"
            aria-label="瞄准右微调"
          >
            ›
          </button>
        </div>
      </div>
      <div class="outerMenu">
        <button
          class="menuButton half-height"
          title="留言"
          id="comment"
          type="submit"
          aria-label="留言"
          hidden
        >
          🗨
        </button>
        <div id="commentMenu" class="comment-menu" style="display: none"></div>
        <button
          class="menuButton half-height"
          title="截图"
          id="diagram"
          type="submit"
          aria-label="截图"
          hidden
        >
          📸
        </button>
        <button
          class="menuButton half-height"
          title="分享"
          id="share"
          type="submit"
          aria-label="分享"
          hidden
        >
          🔗
        </button>
        <button
          class="menuButton half-height"
          title="认输"
          id="concede"
          type="submit"
          aria-label="认输"
          hidden
        >
          🏳️
        </button>
        <button
          class="menuButton half-height"
          title="分析"
          id="analysis"
          type="submit"
          aria-label="击球分析"
          hidden
        >
          🔍
        </button>
        <button
          class="menuButton half-height"
          title="菜单"
          id="menu"
          type="submit"
          aria-label="菜单"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <button
          class="menuButton aim"
          title="切换视角"
          id="camera"
          type="submit"
          aria-label="切换视角"
        >
          🎥
        </button>
      </div>
    </div>

    <div id="ballTray" class="tray-container" aria-live="polite" role="log">
      <div class="nav-btn btn-left" id="trayLeft">❮</div>
      <div class="ball-tray-list" id="ballTrayList"></div>
      <div class="nav-btn btn-right" id="trayRight">❯</div>
    </div>
    <div class="tray-score-container">
      <div id="p1Score" class="p1Score"></div>
      <div id="p2Score" class="p2Score"></div>
    </div>

    <script defer src="three_core.js"></script>
    <script defer src="three_module.js"></script>
    <script defer src="three_examples.js"></script>
    <script defer src="index.js"></script>
    <script defer src="back-confirm-cn.js"></script>
  </body>
</html>
