<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>音效库测试页（不参与发布）</title>
</head>
<body>
<p>仅供 QA 验证音效链路，不参与正式发布。</p>
<script>
/**
 * 最小 THREE stub。
 *
 * 不加载真正的 three：dist/three_core.js 是 webpack chunk（挂到
 * self.webpackChunkbilliards），并不暴露全局 THREE，而测试包是用
 * externals:{three:"THREE"} 编的，只用到 AudioListener / AudioLoader /
 * Vector3 三个类。加载完整 three（1MB+）既慢又没必要。
 * AudioLoader 用 fetch + decodeAudioData 真实解码，保证验证的是真链路。
 */
(function () {
  var AC = window.AudioContext || window.webkitAudioContext;
  var decodeCtx = null;
  window.THREE = {
    AudioListener: function AudioListener() {
      this.context = new AC();
    },
    AudioLoader: function AudioLoader() {
      this.load = function (url, onLoad, onProgress, onError) {
        if (!decodeCtx) decodeCtx = new AC();
        fetch(url)
          .then(function (r) { return r.arrayBuffer(); })
          .then(function (b) { return decodeCtx.decodeAudioData(b); })
          .then(function (buf) { onLoad && onLoad(buf); })
          .catch(function (e) { onError && onError(e); });
      };
    },
    Vector3: function Vector3(x, y, z) {
      this.x = x || 0; this.y = y || 0; this.z = z || 0;
    },
  };
})();
</script>
<script src="sfx-test.js"></script>
</body>
</html>
